            ];

        function createAmbientBackgroundStars() {
            const starCount = 6500;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(starCount * 3);
            const colors = new Float32Array(starCount * 3);

            const palette = [
                new THREE.Color(0x93c5fd),
                new THREE.Color(0xffffff),
                new THREE.Color(0xfef08a),
                new THREE.Color(0xfca5a5),
                new THREE.Color(0xc084fc)
            ];

            for (let i = 0; i < starCount; i++) {
                const u = Math.random();
                const v = Math.random();
                const theta = u * 2.0 * Math.PI;
                const phi = Math.acos(2.0 * v - 1.0);
                const r = 1100 + Math.random() * 450;

                positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
                positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
                positions[i * 3 + 2] = r * Math.cos(phi);

                const c = palette[Math.floor(Math.random() * palette.length)];
                colors[i * 3] = c.r;
                colors[i * 3 + 1] = c.g;
                colors[i * 3 + 2] = c.b;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: 2.2,
                vertexColors: true,
                transparent: true,
                opacity: 0.8
            });

            const points = new THREE.Points(geometry, material);
            celestialSphereGroup.add(points);
        }

        function buildSolarSystemPlanets() {

                const pos = new THREE.Vector3(x, 0, z);

                // Planet Orbit Circle Line
                const orbitGeo = new THREE.BufferGeometry();
                const orbitPoints = [];
                const segments = 128;
                for (let i = 0; i <= segments; i++) {
                    const theta = (i / segments) * Math.PI * 2;
                    orbitPoints.push(new THREE.Vector3(p.orbitRadius * Math.cos(theta), 0, p.orbitRadius * Math.sin(theta)));
                }
                orbitGeo.setFromPoints(orbitPoints);
                const orbitMat = new THREE.LineBasicMaterial({
                    color: 0x64748b,
                    transparent: true,
                    opacity: 0.35
                });
                const orbitLine = new THREE.Line(orbitGeo, orbitMat);
                celestialSphereGroup.add(orbitLine);
                orbitLineMeshes.push(orbitLine);

                // Planet Mesh
                const mesh=createBodyModel(p.bodyId,{size:p.size,color:p.color});
                mesh.position.copy(pos);
                mesh.userData = { id: p.id, type: 'solar', data: p, name: p.name, orbitRadius: p.orbitRadius, angle: angle, speed: p.speed, radius: p.size };

                mesh.traverse(m=>{if(m.isMesh)m.userData=mesh.userData;});
                celestialSphereGroup.add(mesh);
                planetMeshes.push(mesh);

                const pLabel = document.createElement('div');
                pLabel.className = 'badge-label planet-label';
                pLabel.innerHTML = `<span class="mr-1 font-orbitron">${p.symbol}</span><span>${p.bodyId ? "["+p.bodyId+"] " : ""}${p.name}</span>`;
                pLabel.onclick = () => selectSolarObject(p.id);
                labelsContainer.appendChild(pLabel);

                planetLabels.push({
                    id: p.id,
                    element: pLabel,
                    pos: pos,
                    data: p,
                    mesh: mesh
                });
            });
        }

        function buildDistalConstellations() {

            CONSTELLATIONS_DATA.forEach(data => {
                const group = new THREE.Group();
                group.userData = { id: data.id, name: data.name, data: data };

                const centerCartesian = sphericalToCartesian(CONSTELLATION_SKY_RADIUS, data.lat, data.lon);
                const centerVec = new THREE.Vector3(centerCartesian[0], centerCartesian[1], centerCartesian[2]);

                const starPositions = [];
                let maxDistFromCenter = 0;

                data.stars.forEach((starObj, idx) => {
                    const rel = starObj.rel;
                    const starPos = new THREE.Vector3(
                        centerVec.x + rel[0],
                        centerVec.y + rel[1],
                        centerVec.z + rel[2]
                    );
                    starPositions.push(starPos);

                    const dist = new THREE.Vector3(rel[0], rel[1], rel[2]).length();
                    if (dist > maxDistFromCenter) maxDistFromCenter = dist;

                    const starRadius=Math.max(1.5,5.5-(starObj.mag??3)*.65);
                    const starMesh=createBodyModel(starObj.bodyId,{size:starRadius,color:data.color});
                    starMesh.position.copy(starPos);
                    starMesh.userData = { parentConstellation: data.id, starIndex: idx, starName: starObj.name, groupData: data,bodyId:starObj.bodyId,radius:starRadius };

                    starMesh.traverse(m=>{if(m.isMesh)m.userData=starMesh.userData;});
                    group.add(starMesh);

                    if (starObj.name) {
                        const sLabel = document.createElement('div');

                        sLabel.innerText = '['+starObj.bodyId+'] '+starObj.name;
                        sLabel.style.cursor='pointer';sLabel.style.pointerEvents='auto';sLabel.onclick=()=>selectStar(data.id,idx);
                        labelsContainer.appendChild(sLabel);

                        starLabels.push({
                            element: sLabel,
                            pos: starPos,
                            parent: data.id,
                            name: starObj.name,
                            mesh: starMesh
                        });
                    }
                });

                // Constellation Line Segments
                const lineGeometry = new THREE.BufferGeometry();
                const linePositions = [];

                data.lines.forEach(pair => {
                    const p1 = starPositions[pair[0]];
                    const p2 = starPositions[pair[1]];
                    if (p1 && p2) {
                        linePositions.push(p1.x, p1.y, p1.z);
                        linePositions.push(p2.x, p2.y, p2.z);

                lineGeometry.setAttribute('position', new THREE.Float32BufferAttribute(linePositions, 3));
                const lineMaterial = new THREE.LineBasicMaterial({

                cLabel.style.color='#'+data.color.toString(16).padStart(6,'0');cLabel.style.borderColor=cLabel.style.color;

                cLabel.onclick = () => selectConstellation(data.id);
                labelsContainer.appendChild(cLabel);

                constellationLabels.push({
                    id: data.id,
                    element: cLabel,
                    pos: centerVec,

                });
            });
        }

        function spawnSatellitesForPlanet(planetMesh, pData) {
            clearSatellites();
            if (!pData.satellites || pData.satellites.length === 0) return;

            activeSatelliteGroup = new THREE.Group();
            planetMesh.add(activeSatelliteGroup);
            neutralizeParentScale(activeSatelliteGroup,planetMesh);
            activeSatelliteData = [];

            const labelsContainer = document.getElementById('labels-container');

            pData.satellites.forEach((sat, idx) => {
                const satAngle = sat.phase??(idx * 2.399963);
                const satMesh = makeMoon(sat);
                satMesh.traverse(child=>{if(child.isMesh)child.userData={type:'satellite',sat,root:satMesh,residentKey:'moon:'+pData.id+':'+sat.key};});
                satMesh.userData.residentKey='moon:'+pData.id+':'+sat.key;
                satMesh.position.set(
                    sat.radius * Math.cos(satAngle),
                    0,
                    sat.radius * Math.sin(satAngle)
                );

                // Orbit Line
                const orbitGeo = new THREE.BufferGeometry();
                const orbitPoints = [];
                for (let i = 0; i <= 128; i++) {
                    const theta = (i / 128) * Math.PI * 2;
                    orbitPoints.push(satelliteOrbitPoint(sat,theta));
                }
                orbitGeo.setFromPoints(orbitPoints);
                const orbitMat = new THREE.LineBasicMaterial({ color: sat.color, transparent: true, opacity: pData.id==='trisolaris_e'?.25:.12 });

        // --- DYNAMIC CAMERA FOCUS & ORBIT TRACKING (30% SCREEN FILL) ---
        function focusCameraOnTarget(targetMesh, boundingRadius, enableTracking = false, viewDirection=null) {
            if(pairFocus && targetMesh!==pairFocus.anchor && targetMesh!==pairFocus.child)clearPairFocus();
            camera.fov=55;camera.updateProjectionMatrix();controls.maxDistance=1800;
            const serial=++focusSerial;
            const fovRad = (camera.fov * Math.PI) / 180;
            const requiredDistance = boundingRadius / (0.60 * Math.tan(fovRad / 2.0) * Math.min(1,camera.aspect));
            const clampedDist = Math.max(requiredDistance, 2.5);

            const targetWorldPos = targetMesh.getWorldPosition(new THREE.Vector3());

            const currentDir = viewDirection?viewDirection.clone():camera.position.clone().sub(controls.target);
            if (currentDir.lengthSq() < 0.001) {
                currentDir.set(0, 0.5, 1);
            }
            currentDir.normalize();

            const endCamPos = targetWorldPos.clone().add(currentDir.multiplyScalar(clampedDist));
            const startCamPos = camera.position.clone();
            const startTarget = controls.target.clone();

            const startTime = performance.now();
            const duration = 1000;

            function animateFocus(now) {
                if(serial!==focusSerial)return;
                const elapsed = now - startTime;
                const progress = Math.min(elapsed / duration, 1.0);
                const ease = 1 - Math.pow(1 - progress, 3);

                const currentTargetWorld = targetMesh.getWorldPosition(new THREE.Vector3());

                controls.target.lerpVectors(startTarget, currentTargetWorld, ease);
                camera.position.lerpVectors(startCamPos, endCamPos, ease);
                controls.update();

                if (progress < 1.0) {
                    requestAnimationFrame(animateFocus);
                } else if (enableTracking) {
                    trackingTargetMesh = targetMesh;
                }
            }

            trackingTargetMesh = null;
            requestAnimationFrame(animateFocus);
        }

        function onPointerSelect(event) {

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(celestialSphereGroup.children, true);

            for (let i = 0; i < intersects.length; i++) {
                const obj = intersects[i].object;
                if(obj.userData?.type==='resident'){showDeparture(obj.userData.row,obj.userData.kind||'resident');break;}
                else if(obj.userData && obj.userData.type==='satellite'){selectSatellite(obj.userData.sat,obj.userData.root);break;}
                else if (obj.userData && obj.userData.type === 'solar') {
                    selectSolarObject(obj.userData.id);
                    break;
                } else if (obj.userData && obj.userData.type === 'probe') {
                    selectProbeObject(obj.userData.id);
                    break;
                } else if (obj.userData && obj.userData.parentConstellation) {
                    selectStar(obj.userData.parentConstellation, obj.userData.starIndex);
                    break;
