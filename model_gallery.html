<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星空模型目錄</title><style>*{box-sizing:border-box}body{margin:0;background:#07101d;color:#dce7f4;font:14px system-ui}header{position:sticky;top:0;z-index:3;padding:15px 24px;background:#101c2bf5;border-bottom:1px solid #334155}h1{font-size:20px;margin:0 0 8px}p{margin:6px 0;color:#9eacc0}select,a{background:#13263c;color:#7dd3fc;padding:7px;border:1px solid #39536d}main{position:relative;z-index:1;padding:20px 24px 42px;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}article{height:230px;border:1px solid #334155;border-radius:6px;position:relative}article h3{font-size:13px;margin:12px}code{display:block;margin:0 12px;color:#6ee7b7;font-size:12px}.viewport{position:absolute;left:1px;right:1px;top:61px;bottom:1px}canvas{position:fixed;inset:0;z-index:0;pointer-events:none}footer{position:fixed;bottom:0;z-index:5;width:100%;text-align:center;background:#07101d;font-size:10px;padding:4px}</style><header><h1>星空模型目錄</h1><p>模型編號可用於天體或居民的 modelId。</p><select id="category"></select> <a href="editor.html">開啟居民編輯器</a><p id="status">載入中…</p></header><main id="gallery"></main><footer>Copyright © 2026-2030 anshaer.com. All rights reserved.</footer><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script src="model-renderer.js"></script><script>
(async()=>{try{const res=await fetch('models.json',{cache:'no-cache'});if(!res.ok)throw Error('models.json '+res.status);const doc=await res.json();StarModelLibrary.setModels(doc.models);const renderer=new THREE.WebGLRenderer({alpha:true,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.body.appendChild(renderer.domElement);let cards=[],lastW=0,lastH=0;const categories={satellite:'人造衛星',moon:'天體衛星',planet:'天體（不含太陽）',astronaut:'太空人',debris:'太空遺失物／工具',spaceship:'太空船',body:'原有天體',legacy:'原有任務模型'},select=document.getElementById('category');for(const [key,name] of Object.entries(categories)){const count=Object.values(doc.models).filter(m=>m.category===key).length;if(count)select.add(new Option(name+' · '+count,key));}function build(){for(const c of cards)StarModelLibrary.dispose(c.model);cards=[];const gallery=document.getElementById('gallery');gallery.replaceChildren();for(const [id,def] of Object.entries(doc.models)){if(def.category!==select.value)continue;const article=document.createElement('article'),h=document.createElement('h3'),code=document.createElement('code'),view=document.createElement('div');h.textContent=def.name;code.textContent=id;view.className='viewport';article.append(h,code,view);gallery.appendChild(article);const scene=new THREE.Scene(),model=StarModelLibrary.create(id,{size:1,color:0x9fc4df});scene.add(model,new THREE.AmbientLight(0xffffff,1.5));const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(3,5,4);scene.add(light);const box=new THREE.Box3().setFromObject(model),center=box.getCenter(new THREE.Vector3()),r=Math.max(.2,box.getSize(new THREE.Vector3()).length()/2);model.position.sub(center);const camera=new THREE.PerspectiveCamera(38,1,.05,100);camera.position.set(r*2,r*1.1,r*2.8);camera.lookAt(0,0,0);cards.push({view,scene,model,camera});}document.getElementById('status').textContent='目前 '+cards.length+' 款 · 與主頁及編輯器共用模型程式';}select.onchange=build;build();function draw(time){requestAnimationFrame(draw);if(lastW!==innerWidth||lastH!==innerHeight){lastW=innerWidth;lastH=innerHeight;renderer.setSize(innerWidth,innerHeight);}renderer.setScissorTest(false);renderer.clear();renderer.setScissorTest(true);for(const c of cards){const r=c.view.getBoundingClientRect();if(r.bottom<0||r.top>innerHeight)continue;c.camera.aspect=r.width/r.height;c.camera.updateProjectionMatrix();c.model.rotation.y=time*.00015;renderer.setViewport(r.left,innerHeight-r.bottom,r.width,r.height);renderer.setScissor(r.left,innerHeight-r.bottom,r.width,r.height);renderer.render(c.scene,c.camera);}}requestAnimationFrame(draw);}catch(e){document.getElementById('status').textContent='載入失敗：'+e.message;}})();
</script></html>
